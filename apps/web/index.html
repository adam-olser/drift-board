<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121317" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="A small collaborative task board with real-time sync, optimistic UI and offline support."
    />
    <!-- og:image/url use the production origin; social scrapers fetch these server-side and
         cannot resolve a relative path, so this only shows correctly on the deployed site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Driftboard" />
    <meta property="og:title" content="Driftboard" />
    <meta
      property="og:description"
      content="A small collaborative task board with real-time sync, optimistic UI and offline support."
    />
    <meta property="og:image" content="https://driftboard-4yjg.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://driftboard-4yjg.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Driftboard" />
    <meta
      name="twitter:description"
      content="A small collaborative task board with real-time sync, optimistic UI and offline support."
    />
    <meta name="twitter:image" content="https://driftboard-4yjg.onrender.com/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Driftboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Shown until React mounts; the bundle is ~600 kB, so this is not a blank page on slow links. */
      .splash {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font:
          600 14px/1 'IBM Plex Sans',
          'Helvetica Neue',
          Arial,
          sans-serif;
        color: #9aa0ab;
        animation: splash-in 400ms 300ms backwards;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121317;
        }
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f3f4f2;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="#b7f26a"
          stroke-width="1.5"
        >
          <path d="M2 5h12M2 8h8M2 11h10" />
        </svg>
        Loading Driftboard…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
