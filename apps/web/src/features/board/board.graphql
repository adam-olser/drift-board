fragment CardFields on Card {
  id
  key
  title
  description
  columnId
  position
  priority
  dueDate
  assignee {
    sessionId
    name
    color
  }
  labels {
    id
    name
    color
  }
  version
  updatedAt
  updatedBy {
    sessionId
    name
    color
  }
}

fragment ColumnFields on Column {
  id
  title
  position
}

query Board($slug: String!) {
  board(slug: $slug) {
    id
    slug
    name
    keyPrefix
    columns {
      ...ColumnFields
    }
    cards {
      ...CardFields
    }
    labels {
      id
      name
      color
    }
  }
}

mutation MoveCard($opId: ID!, $cardId: ID!, $columnId: ID!, $position: Float!) {
  moveCard(opId: $opId, cardId: $cardId, columnId: $columnId, position: $position) {
    ...CardFields
  }
}

mutation UpdateCard(
  $opId: ID!
  $cardId: ID!
  $baseVersion: Int!
  $title: String
  $description: String
  $priority: Priority
  $dueDate: Date
  $assigneeSessionId: ID
) {
  updateCard(
    opId: $opId
    cardId: $cardId
    baseVersion: $baseVersion
    title: $title
    description: $description
    priority: $priority
    dueDate: $dueDate
    assigneeSessionId: $assigneeSessionId
  ) {
    ...CardFields
  }
}

mutation AddLabel($opId: ID!, $cardId: ID!, $name: String!, $color: String!) {
  addLabel(opId: $opId, cardId: $cardId, name: $name, color: $color) {
    ...CardFields
  }
}

mutation RemoveLabel($opId: ID!, $cardId: ID!, $labelId: ID!) {
  removeLabel(opId: $opId, cardId: $cardId, labelId: $labelId) {
    ...CardFields
  }
}

mutation CreateCard(
  $opId: ID!
  $id: ID!
  $boardId: ID!
  $columnId: ID!
  $title: String!
  $position: Float!
) {
  createCard(
    opId: $opId
    id: $id
    boardId: $boardId
    columnId: $columnId
    title: $title
    position: $position
  ) {
    ...CardFields
  }
}

mutation DeleteCard($opId: ID!, $cardId: ID!) {
  deleteCard(opId: $opId, cardId: $cardId)
}

fragment PresenceFields on Presence {
  sessionId
  name
  color
  viewingCardId
}

subscription BoardEvents($boardId: ID!) {
  boardEvents(boardId: $boardId) {
    __typename
    ... on CardCreated {
      origin
      card {
        ...CardFields
      }
    }
    ... on CardUpdated {
      origin
      card {
        ...CardFields
      }
    }
    ... on CardMoved {
      origin
      cards {
        ...CardFields
      }
    }
    ... on CardDeleted {
      origin
      cardId
    }
    ... on PresenceChanged {
      origin
      peers {
        ...PresenceFields
      }
    }
  }
}

mutation SetViewing($boardId: ID!, $cardId: ID) {
  setViewing(boardId: $boardId, cardId: $cardId)
}
