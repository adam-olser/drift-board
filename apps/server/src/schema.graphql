"""
ISO-8601 timestamp, stamped server-side.
"""
scalar DateTime
"""
Calendar date, no time component: "2026-09-30".
"""
scalar Date

enum Priority {
  NONE
  LOW
  MEDIUM
  HIGH
}

type Board {
  id: ID!
  slug: String!
  name: String!
  keyPrefix: String!
  columns: [Column!]!
  """
  One flat list; the client groups by columnId and sorts by position.
  """
  cards: [Card!]!
  labels: [Label!]!
}

type Column {
  id: ID!
  title: String!
  position: Int!
}

type Card {
  id: ID!
  key: String!
  title: String!
  description: String!
  columnId: ID!
  position: Float!
  priority: Priority!
  dueDate: Date
  assignee: Peer
  labels: [Label!]!
  """
  Bumped only by updateCard. Moves never touch it.
  """
  version: Int!
  updatedAt: DateTime!
  updatedBy: Peer!
}

type Label {
  id: ID!
  name: String!
  color: String!
}

type Peer {
  sessionId: ID!
  name: String!
  color: String!
}

type Presence {
  sessionId: ID!
  name: String!
  color: String!
  viewingCardId: ID
}

type Session {
  id: ID!
  displayName: String!
  color: String!
  user: User
}

type User {
  id: ID!
  email: String!
  name: String!
}

type Viewer {
  session: Session
  boards: [Board!]!
}

type Query {
  board(slug: String!): Board
  viewer: Viewer!
}

type Mutation {
  # ---- HTTP only: these set the cookie
  startGuestSession(displayName: String!): Session!
  signUp(email: String!, password: String!, name: String!): Session!
  logIn(email: String!, password: String!): Session!
  logOut: Session!

  # ---- socket, no opId (cannot happen offline)
  createBoard(name: String!): Board!

  # ---- socket, each carries a client-generated opId; id on createCard is client-generated too
  createCard(
    opId: ID!
    id: ID!
    boardId: ID!
    columnId: ID!
    title: String!
    position: Float!
  ): Card!
  updateCard(
    opId: ID!
    cardId: ID!
    baseVersion: Int!
    title: String
    description: String
    priority: Priority
    """
    Pass an explicit null to clear the due date; omit to leave it unchanged.
    """
    dueDate: Date
    """
    Session id to assign, or an explicit null to unassign; omit to leave it unchanged.
    """
    assigneeSessionId: ID
  ): Card!
  """
  Returns every card the move (or a resulting reindex) touched.
  """
  moveCard(opId: ID!, cardId: ID!, columnId: ID!, position: Float!): [Card!]!
  deleteCard(opId: ID!, cardId: ID!): ID!

  # ---- socket, no opId, no ledger row, no Postgres
  setViewing(boardId: ID!, cardId: ID): Boolean!

  """
  Creates the label if the board has none by that name yet (case-insensitive), else reuses it.
  """
  addLabel(opId: ID!, cardId: ID!, name: String!, color: String!): Card!
  removeLabel(opId: ID!, cardId: ID!, labelId: ID!): Card!
}

"""
Every event carries origin = the session that caused it; a client ignores its own events.
"""
type CardCreated {
  origin: ID!
  card: Card!
}
type CardUpdated {
  origin: ID!
  card: Card!
}
type CardMoved {
  origin: ID!
  cards: [Card!]!
}
type CardDeleted {
  origin: ID!
  cardId: ID!
}
type PresenceChanged {
  origin: ID!
  peers: [Presence!]!
}
union BoardEvent = CardCreated | CardUpdated | CardMoved | CardDeleted | PresenceChanged

type Subscription {
  boardEvents(boardId: ID!): BoardEvent!
}
