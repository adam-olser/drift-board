# Render blueprint: one web service serving the API and the web bundle. Free plan (D-028): it
# sleeps after ~15 min idle and the first request wakes it, which takes up to a minute.
# The database is Neon (D-008); paste its connection string as DATABASE_URL in the dashboard.
services:
  - type: web
    name: driftboard
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /graphiql
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
